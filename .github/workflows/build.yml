name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check editor scripts
        run: |
          node --check public/admin/editor/visual-builder.js
          node --check public/admin/editor/visual-fixed-sections.js
          node --check public/admin/editor/visual-safety.js
          node --check public/admin/editor/direct-canvas.js
          node --check public/admin/editor/direct-canvas-controls-fix.js
          node --check public/admin/editor/publish-guard.js
          node --check public/admin/editor/admin-shell.js
          node --check public/admin/editor/workspace-tools.js
          node --check public/admin/editor/preview-readonly.js
          node --check scripts/build-admin-preview-data.mjs

      - name: Check publishing regressions
        run: node scripts/content-regression-check.mjs

      - name: Check admin workspace
        run: node scripts/admin-workspace-check.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
