name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check editor scripts
        run: |
          node --check public/admin/editor/visual-builder.js
          node --check public/admin/editor/visual-fixed-sections.js
          node --check public/admin/editor/visual-safety.js
          node --check public/admin/editor/direct-canvas.js
          node --check public/admin/editor/direct-canvas-controls-fix.js
          node --check public/admin/editor/publish-guard.js
          node --check public/admin/editor/editor-github-compat.js
          node --check public/admin/editor/access-fetch-fix.js
          node --check functions/_shared/admin-session.js
          node --check functions/admin/auth.js
          node --check functions/admin/api/session.js
          node --check functions/admin/api/content.js
          node --check "functions/admin/api/github/[[path]].js"
          node --check functions/admin/api/media.js
          node --check functions/admin/api/blog-post.js
          node --check functions/admin/api/white-paper.js

      - name: Check publishing regressions
        run: node scripts/content-regression-check.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
