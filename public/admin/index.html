<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta name="theme-color" content="#1a2b46" />
    <title>Mercier Talent Solutions Admin</title>
    <link rel="stylesheet" href="/admin/admin-ui.css" />
    <link rel="stylesheet" href="/admin/page-guide.css" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script>
      window.CMS.registerPreviewStyle("/admin/page-preview.css");
      window.CMS.registerPreviewStyle("/admin/preview-friendly.css");

      window.initCMS({
        config: {
          backend: {
            name: "github",
            repo: "allie-mcfarlane/mercier-talent-solutions",
            branch: "main",
            api_root: "https://mercier-talent-solutions.pages.dev/admin/api/github",
            base_url: "https://mercier-talent-solutions.pages.dev",
            auth_endpoint: "admin/auth",
            site_domain: "mercier-talent-solutions.pages.dev",
            use_graphql: false
          }
        }
      });

      (() => {
        const relabel = () => {
          document.querySelectorAll("button").forEach((button) => {
            if (button.textContent && button.textContent.includes("Login with GitHub")) {
              const walker = document.createTreeWalker(button, NodeFilter.SHOW_TEXT);
              while (walker.nextNode()) {
                const node = walker.currentNode;
                if (node.nodeValue && node.nodeValue.includes("Login with GitHub")) {
                  node.nodeValue = node.nodeValue.replace("Login with GitHub", "Continue to Mercier Admin");
                }
              }
            }
          });
        };
        new MutationObserver(relabel).observe(document.body, { childList: true, subtree: true });
        relabel();
      })();
    </script>
    <script src="/admin/admin-preview.js"></script>
    <script src="/admin/settings-preview.js"></script>
    <script src="/admin/admin-ui.js"></script>
    <script src="/admin/page-guide.js"></script>
  </body>
</html>
