backend:
  name: github
  repo: allie-mcfarlane/mercier-talent-solutions
  branch: main
  commit_messages:
    create: "Create {{collection}} {{slug}}"
    update: "Update {{collection}} {{slug}}"
    delete: "Delete {{collection}} {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

local_backend: true

site_url: https://merciertalentsolutions.com
display_url: https://merciertalentsolutions.com
logo_url: /images/mercier-logo-color.png
show_preview_links: true
editor:
  preview: true
  preview_styles:
    - /admin/preview.css

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: editorial_workflow

collections:
  - name: pages
    label: Site Pages
    files:
      - name: home
        label: Home Page
        file: src/content/pages/home.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string, hint: "The final italic blue word." }
          - { label: Intro Text, name: lede, widget: text }
          - label: Primary Button
            name: primaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Secondary Button
            name: secondaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Proof Cards
            name: proof
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Marquee Items, name: marqueeItems, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Approach Section
            name: approach
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Bullet Items, name: items, widget: list, field: { label: Item, name: item, widget: string } }
          - label: News Section
            name: news
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
      - name: about
        label: About Page
        file: src/content/pages/about.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Intro Text, name: lede, widget: text }
          - label: Firm Panel
            name: firm
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Team
            name: team
            widget: list
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Image Alt Text, name: imageAlt, widget: string }
              - { label: Bio Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: LinkedIn, name: linkedin, widget: string }
              - { label: Credentials Eyebrow, name: credentialsEyebrow, widget: string }
              - { label: Credentials, name: credentials, widget: text }
      - name: news-page
        label: News Page
        file: src/content/pages/news.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Intro Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
      - name: whitepapers-page
        label: White Papers Page
        file: src/content/pages/whitepapers.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Intro Text, name: lede, widget: text }
      - name: contact
        label: Contact Page
        file: src/content/pages/contact.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - label: Direct Contacts
            name: contacts
            widget: list
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Name, name: name, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
      - name: services-page
        label: Services Page
        file: src/content/pages/services.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Intro Text, name: lede, widget: text }
          - { label: Hero Image, name: heroImage, widget: image }
          - { label: Hero Image Alt Text, name: heroImageAlt, widget: string }
          - { label: Focus Intro, name: focusIntro, widget: text }
          - label: Focus Areas
            name: focusAreas
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Services
            name: services
            widget: list
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Number, name: number, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Home Card Text, name: text, widget: text }
              - { label: Summary, name: summary, widget: text }
              - { label: Detail, name: detail, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Image Alt Text, name: imageAlt, widget: string }
              - label: Highlights
                name: highlights
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Training Section
            name: training
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Groups
                name: groups
                widget: list
                fields:
                  - { label: Group, name: group, widget: string }
                  - label: Items
                    name: items
                    widget: list
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Text, name: text, widget: text }
          - label: Consulting Section
            name: consulting
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
      - name: privacy
        label: Privacy Policy
        file: src/content/pages/privacy.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Last Updated, name: updated, widget: string }
          - { label: Policy Content, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list] }
      - name: privacy-choices
        label: Privacy Choices Page
        file: src/content/pages/privacy-choices.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Form Email Subject, name: formSubject, widget: string }
          - { label: Form Name, name: formName, widget: string }
          - { label: Request Options, name: requestOptions, widget: list, field: { label: Option, name: option, widget: string } }
          - { label: Page Intro Content, name: body, widget: markdown, buttons: [bold, italic, link, bulleted-list, numbered-list] }
      - name: data-requests
        label: Data Requests & Appeals Page
        file: src/content/pages/data-requests.md
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Title Accent, name: titleAccent, widget: string }
          - { label: Form Email Subject, name: formSubject, widget: string }
          - { label: Form Name, name: formName, widget: string }
          - { label: Show Name Field, name: includeName, widget: boolean, default: true }
          - { label: Request Options, name: requestOptions, widget: list, field: { label: Option, name: option, widget: string } }
          - { label: Page Intro Content, name: body, widget: markdown, buttons: [bold, italic, link, bulleted-list, numbered-list] }
  - name: posts
    label: News & Insights
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{category}} - {{pubDate}}"
    preview_path: "post/{{slug}}"
    sortable_fields: [title, pubDate, updatedDate, category]
    view_filters:
      - label: Insights
        field: category
        pattern: Insight
      - label: Speaking
        field: category
        pattern: Speaking
      - label: White Papers
        field: category
        pattern: White Paper
      - label: Announcements
        field: category
        pattern: Announcement
      - label: News
        field: category
        pattern: News
    view_groups:
      - label: Category
        field: category
      - label: Publication Year
        field: pubDate
        pattern: \d{4}
    fields:
      - { label: Title, name: title, widget: string, hint: "Use the exact published headline." }
      - { label: Subtitle, name: subtitle, widget: string, required: false, hint: "Optional. Displays directly under the article title in blue italic type." }
      - { label: Author, name: author, widget: string, default: Julia Mercier }
      - { label: Author Job Title, name: authorTitle, widget: string, default: Principal }
      - { label: Author Headshot, name: authorImage, widget: image, required: false, hint: "Optional. Upload the writer headshot shown beside the byline." }
      - { label: Author Headshot Alt Text, name: authorImageAlt, widget: string, required: false }
      - { label: Publication Date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}" }
      - { label: Updated Date, name: updatedDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: Category, name: category, widget: select, default: Insight, options: [Insight, Speaking, White Paper, Announcement, News] }
      - { label: Excerpt, name: excerpt, widget: text, hint: "Short card and SEO summary shown on the News & Insights page only." }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Featured Image Alt Text, name: imageAlt, widget: string, required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false, hint: "Optional. Leave blank to use the article title." }
      - { label: SEO Description, name: seoDescription, widget: text, required: false, hint: "Optional. Leave blank to use the excerpt." }
      - label: References
        name: references
        widget: list
        required: false
        hint: "Optional. Add sources in citation order. In the Body, type [1], [2], [3], etc. where each superscript citation should appear."
        fields:
          - { label: Reference Text, name: text, widget: text }
          - { label: Source URL, name: url, widget: string }
      - { label: Body, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], hint: "For linked citations, type [1], [2], [3], etc. in the article text and add matching sources to References above." }
  - name: white-papers
    label: White Papers
    label_singular: White Paper
    folder: src/content/white-papers
    create: true
    identifier_field: title
    slug: "{{slug}}"
    description: "Add or edit white papers. Each entry automatically creates one tile on the White Papers page."
    summary: "No. {{number}} - {{title}} - {{date}}"
    preview_path: "whitepapers"
    sortable_fields: [number, title, date]
    view_groups:
      - label: Publication Year
        field: date
        pattern: \d{4}
    fields:
      - { label: Title, name: title, widget: string, hint: "This becomes the tile title." }
      - { label: White Paper Number, name: number, widget: string, hint: "Use the display number, for example 03. This becomes WHITE PAPER No. 03." }
      - { label: Publication Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "This controls the displayed date and newest-first ordering." }
      - { label: Description, name: description, widget: text, hint: "This becomes the italic subtitle on the tile." }
      - { label: Document, name: document, widget: file, required: false, media_folder: public/documents, public_folder: /documents, hint: "Upload the PDF here. The download button appears automatically when a document is attached." }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Featured Image Alt Text, name: imageAlt, widget: string, required: false }
      - { label: Tile Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], hint: "This is the main paragraph shown on the tile." }
